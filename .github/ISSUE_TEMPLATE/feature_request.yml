name: Đề xuất tính năng
description: Đề xuất cải tiến trong phạm vi tracker read-only
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề
      description: Ai gặp vấn đề này và trong workflow nào?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Kết quả mong muốn
    validations:
      required: true

  - type: textarea
    id: semantics
    attributes:
      label: Ảnh hưởng dữ liệu
      description: Grain, KPI, attribution, timezone, permission hoặc migration nào bị ảnh hưởng?

  - type: dropdown
    id: mutation
    attributes:
      label: Có yêu cầu sửa/tắt/tạo quảng cáo không?
      options:
        - Không, vẫn read-only
        - Có
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Mutation Meta Ads nằm ngoài phạm vi MVP và cần threat model/quyết định kiến trúc riêng.
